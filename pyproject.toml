[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-detection-engine"
version = "1.0.0"
description = "Sigma-style detection rules for Linux auth logs with ATT&CK-mapped HTML reports"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
detect = "detection_engine.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
